name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

jobs:
    validate:
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        services:
            postgres:
                image: postgres:17.11-alpine3.23
                env:
                    POSTGRES_DB: integration_hub
                    POSTGRES_PASSWORD: integration_hub
                    POSTGRES_USER: integration_hub
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U integration_hub -d integration_hub"
                    --health-interval 2s --health-timeout 3s --health-retries 15
        env:
            CI: "true"
            DATABASE_SSL: disable
            DATABASE_URL: >-
                postgresql://integration_hub:integration_hub@127.0.0.1:5432/integration_hub
            NEXT_TELEMETRY_DISABLED: "1"
            PORT: "3000"
            SERVER_HOST: 127.0.0.1
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Configure Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: .nvmrc
            - name: Install pinned pnpm
              run: npm install --global pnpm@10.33.2
            - name: Configure Just
              uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
              with:
                  just-version: 1.43.1
            - name: Install dependencies
              run: just install
            - name: Validate application
              run: just ci
